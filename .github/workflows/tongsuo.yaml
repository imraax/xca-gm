name: XCA-GM (Tongsuo)

on: [ push, pull_request ]

env:
  BUILD_TYPE: Release
  TONGSUO_VERSION: 8.4.0
  TONGSUO_PREFIX: /opt/tongsuo

jobs:
  build-gm:
    runs-on: ubuntu-latest

    steps:
    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install --yes --no-install-recommends \
          build-essential pkg-config ninja-build cmake perl \
          qt6-base-dev qt6-tools-dev libgl1-mesa-dev xvfb

    - name: Cache Tongsuo
      id: cache-tongsuo
      uses: actions/cache@v4
      with:
        path: ${{ env.TONGSUO_PREFIX }}
        key: tongsuo-${{ env.TONGSUO_VERSION }}-${{ runner.os }}

    - name: Build Tongsuo
      if: steps.cache-tongsuo.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 -b ${TONGSUO_VERSION} \
          https://github.com/Tongsuo-Project/Tongsuo tongsuo-src
        cd tongsuo-src
        ./config --prefix=${TONGSUO_PREFIX} --libdir=lib enable-ntls no-tests
        make -j$(nproc)
        sudo make install_sw

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure
      run: |
        cmake -B build -G Ninja -DXCA_GM=ON \
          -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
          -DOPENSSL_ROOT_DIR=${TONGSUO_PREFIX} \
          -DCMAKE_PREFIX_PATH=${TONGSUO_PREFIX}

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Test
      env:
        LD_LIBRARY_PATH: ${{ env.TONGSUO_PREFIX }}/lib
      run: |
        cmake --build build -t tests -j$(nproc)
        xvfb-run -a ctest --test-dir build --output-on-failure

    - name: Package
      run: cd build && cpack

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: xca-gm-linux
        path: build/xca-gm-*.tar.gz
